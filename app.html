<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Poke Idle Launcher</title>
<style>
  :root{
    --bg:#0a0d13; --panel:#111621; --panel2:#161c2a; --panel3:#0d121b; --hover:#1a2231;
    --line:#1f2734; --line2:#2c3648;
    --txt:#e7e9ef; --mut:#8791a4; --mut2:#5a6478;
    --gold:#ffce56; --good:#3fca74; --warn:#ffb151; --crit:#ff6f81; --info:#5fc6ff;
    --r-Fraca:#8791a4; --r-Comum:#5bcf6e; --r-Incomum:#54a9ff; --r-Rara:#b184ff;
    --r-Épica:#ff9a4d; --r-Lendária:#ffce56; --r-Mythic:#ff5ea8; --r-Ancient:#ff8a3d; --r-Divine:#67f0ff;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--bg); color:var(--txt); font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:13px; -webkit-font-smoothing:antialiased; color-scheme:dark; overflow:hidden; }
  .app{ display:flex; flex-direction:column; height:100vh; }
  button{ font-family:inherit; cursor:pointer; }
  ::-webkit-scrollbar{ width:10px; height:10px; } ::-webkit-scrollbar-thumb{ background:#232c3d; border-radius:6px; border:2px solid var(--bg); }

  /* barra (arrastável) */
  .bar{ height:46px; flex:0 0 46px; display:flex; align-items:center; gap:10px; padding:0 8px 0 14px;
    background:var(--panel); border-bottom:1px solid var(--line); -webkit-app-region:drag; z-index:20; }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:800; letter-spacing:.3px; font-size:13px; }
  .brand .logo{ width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle at 50% 33%, #fff 0 25%, #ee4b4b 26% 48%, #17171a 49% 55%, #dcdcdc 56%); box-shadow:0 0 0 1.5px #17171a inset; }
  .brand b{ color:var(--gold); }
  .bar .sp{ flex:1; }
  .bar button{ -webkit-app-region:no-drag; }
  .tbtn{ height:30px; padding:0 11px; display:flex; align-items:center; gap:6px; border-radius:8px;
    border:1px solid var(--line2); background:var(--panel2); color:var(--txt); font-size:12px; }
  .tbtn:hover{ background:var(--hover); } .tbtn.on{ border-color:var(--gold); color:var(--gold); }
  .ico{ width:32px; height:30px; border:1px solid var(--line); background:transparent; color:var(--mut); border-radius:8px; font-size:14px; }
  .ico:hover{ background:var(--hover); color:var(--txt); } .ico.cl:hover{ background:#7a2130; color:#fff; }

  .body{ display:flex; flex:1; min-height:0; }
  .side{ flex:0 0 236px; border-right:1px solid var(--line); background:var(--panel3); padding:12px 10px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }
  .side-h{ display:flex; align-items:baseline; justify-content:space-between; padding:2px 4px 6px; }
  .side-h .t{ font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--mut); font-weight:700; }
  .side-h .s{ font-size:10.5px; color:var(--mut2); font-variant-numeric:tabular-nums; }
  .nav{ display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:9px; border:1px solid transparent; color:var(--txt); background:transparent; text-align:left; width:100%; font-size:12.5px; }
  .nav:hover{ background:var(--hover); } .nav.on{ background:var(--panel2); border-color:var(--line2); }
  .nav .gi{ font-size:14px; width:16px; text-align:center; }
  .dash-filter{ background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:4px 8px; font-size:10.5px; outline:none; }
  /* shiny hunt (barra lateral) */
  .shl{ display:flex; flex-direction:column; gap:3px; max-height:250px; overflow:auto; }
  .shb{ display:flex; align-items:center; gap:7px; padding:3px 7px; background:var(--panel2); border:1px solid var(--line); border-radius:7px; color:var(--txt); cursor:pointer; font-size:11.5px; text-align:left; width:100%; }
  .shb:hover{ background:var(--hover); border-color:var(--line2); }
  .shb:active{ transform:scale(.98); }
  .shb img{ width:26px; height:26px; image-rendering:pixelated; flex-shrink:0; }
  .shb .nm{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .shb .dx{ margin-left:auto; color:var(--mut2); font-size:9.5px; }
  .shreset{ margin-left:auto; background:transparent; border:1px solid var(--line); color:var(--mut); border-radius:6px; padding:1px 7px; font-size:11px; cursor:pointer; }
  .shreset:hover{ color:var(--txt); border-color:var(--line2); }
  /* acesso rápido à hunt (últimas + leveling sugerido) */
  .qh-cols{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .qh-col{ min-width:0; }
  .qh-h{ font-size:10px; font-weight:700; color:var(--mut2); text-transform:uppercase; letter-spacing:.03em; margin:0 0 5px 1px; }
  .qh-list{ display:flex; flex-direction:column; gap:3px; max-height:230px; overflow:auto; }
  .qhb{ display:flex; align-items:center; gap:6px; padding:3px 6px; background:var(--panel2); border:1px solid var(--line); border-radius:7px; color:var(--txt); cursor:pointer; text-align:left; width:100%; }
  .qhb:hover{ background:var(--hover); border-color:var(--line2); }
  .qhb:active{ transform:scale(.98); }
  .qhb img{ width:24px; height:24px; image-rendering:pixelated; flex-shrink:0; }
  .qhb .qh-tx{ min-width:0; display:flex; flex-direction:column; line-height:1.15; }
  .qhb .nm{ font-weight:600; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qhb .qh-meta{ font-size:9px; color:var(--mut2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qhb .qh-eff{ font-weight:700; }
  .qh-empty{ color:var(--mut); font-size:10px; padding:6px 2px; line-height:1.35; }
  /* controles do jogo (recarregar / limpar cache) */
  .game-ctrls{ display:flex; gap:5px; margin:2px 0 8px; }
  .gcbtn{ flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:7px; padding:5px 6px; font-size:10.5px; cursor:pointer; }
  .gcbtn:hover{ background:var(--hover); border-color:var(--line2); }
  .gcbtn:active{ transform:scale(.97); }
  /* aura vermelha: suprimento crítico em alguma conta */
  #aura{ position:fixed; inset:0; pointer-events:none; z-index:60; opacity:0; transition:opacity .6s ease; box-shadow:inset 0 0 110px 26px rgba(255,77,90,.42); }
  #aura.on{ opacity:1; animation:auraPulse 1.6s ease-in-out infinite; }
  @keyframes auraPulse{ 0%,100%{opacity:.5} 50%{opacity:1} }
  /* central de notificações */
  #btn-notif{ position:relative; }
  .nbadge{ position:absolute; top:1px; right:1px; background:var(--crit); color:#fff; border-radius:8px; min-width:15px; height:15px; font-size:9px; line-height:15px; text-align:center; padding:0 3px; font-weight:700; }
  #notif{ position:fixed; top:52px; right:12px; width:350px; max-height:72vh; display:none; flex-direction:column; background:var(--panel); border:1px solid var(--line2); border-radius:12px; z-index:80; box-shadow:0 12px 34px rgba(0,0,0,.5); overflow:hidden; }
  #notif.show{ display:flex; }
  #notif .nh{ padding:10px 12px 8px; font-weight:700; font-size:12px; display:flex; align-items:center; gap:8px; }
  #notif .nf{ display:flex; gap:5px; padding:7px 12px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  #notif .nl{ overflow:auto; flex:1; }
  #notif .ni{ padding:7px 12px; border-bottom:1px solid var(--line); font-size:11.5px; display:flex; gap:8px; align-items:flex-start; }
  #notif .ni .tm{ margin-left:auto; color:var(--mut2); font-size:10px; white-space:nowrap; }
  #notif table.sup{ width:100%; border-collapse:collapse; font-size:11px; border-bottom:1px solid var(--line); }
  #notif table.sup th,#notif table.sup td{ padding:4px 12px; text-align:right; }
  #notif table.sup th:first-child,#notif table.sup td:first-child{ text-align:left; }
  #notif table.sup th{ color:var(--mut); font-size:9.5px; text-transform:uppercase; letter-spacing:.4px; }
  .low{ color:var(--crit); font-weight:800; }
  .acc{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:var(--panel); width:100%; text-align:left; position:relative; }
  .acc:hover{ background:var(--hover); } .acc.on{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; }
  .acc img{ width:32px; height:32px; image-rendering:pixelated; }
  .acc .an{ font-weight:700; font-size:12.5px; display:flex; align-items:center; gap:6px; color:var(--txt); }
  .dot{ width:7px; height:7px; border-radius:50%; background:#3b4353; display:inline-block; } .dot.on{ background:var(--good); box-shadow:0 0 6px var(--good); }
  .acc .au{ font-size:10.5px; color:var(--mut); margin-top:2px; }
  .acc .ak{ margin-left:auto; text-align:right; }
  .acc .ak .v{ font-weight:800; color:var(--good); font-size:12.5px; font-variant-numeric:tabular-nums; } .acc .ak .k{ font-size:9px; color:var(--mut2); }
  .acc .xr{ position:absolute; top:3px; right:5px; font-size:10px; color:var(--mut2); opacity:0; }
  .acc:hover .xr{ opacity:1; } .acc .xr:hover{ color:var(--crit); }
  /* chat do jogo (movido pra cá) */
  .chatbox{ margin-top:8px; border:1px solid var(--line); border-radius:10px; background:var(--panel3); overflow:hidden; display:flex; flex-direction:column; flex:0 0 auto; }
  .chat-h{ display:flex; align-items:center; justify-content:space-between; padding:8px 10px; cursor:pointer; font-size:11px; font-weight:700; color:var(--mut); text-transform:uppercase; letter-spacing:.08em; }
  .chat-h:hover{ color:var(--txt); } .chat-x{ color:var(--mut2); }
  .chatbox.closed .chat-tabs, .chatbox.closed .chat-body{ display:none; }
  .chat-tabs{ display:flex; gap:3px; padding:0 6px 6px; flex-wrap:wrap; }
  .chat-tab{ font-size:10.5px; padding:3px 7px; border-radius:6px; border:1px solid var(--line2); background:var(--panel2); color:var(--mut); }
  .chat-tab:hover{ color:var(--txt); } .chat-tab.on{ border-color:var(--info); color:var(--info); }
  .chat-body{ max-height:190px; overflow-y:auto; padding:4px 9px 8px; display:flex; flex-direction:column; gap:3px; }
  .cmsg{ font-size:11.5px; line-height:1.35; word-break:break-word; }
  .cmsg .cch{ font-size:9.5px; font-weight:700; text-transform:uppercase; } .cmsg .cnm{ font-weight:700; color:var(--txt); } .cmsg .cnm.vip{ color:var(--gold); }
  .cmsg .clv{ color:var(--mut2); font-size:10px; } .cmsg .cbd{ color:var(--mut); }
  .acc-list{ display:flex; flex-direction:column; gap:8px; margin-top:4px; flex:1 1 auto; min-height:64px; overflow-y:auto; }
  .addacc{ margin-top:6px; padding:9px; border-radius:9px; border:1px dashed var(--line2); background:transparent; color:var(--mut); font-size:12px; flex:0 0 auto; }
  .addacc:hover{ color:var(--gold); border-color:var(--gold); }

  .side.wide{ flex:0 0 312px; }
  .acc-chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:2px; }
  .acc-chip{ display:flex; align-items:center; gap:6px; padding:6px 9px; border-radius:8px; border:1px solid var(--line); background:var(--panel); font-size:12px; cursor:pointer; color:var(--txt); }
  .acc-chip:hover{ background:var(--hover); } .acc-chip.on{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; }
  .acc-chip img{ width:20px; height:20px; image-rendering:pixelated; }
  .sinfo{ display:flex; flex-direction:column; gap:10px; }
  .sinfo .sk{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .sinfo .sk .b{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:9px 11px; }
  .sinfo .sk .b .v{ font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; } .sinfo .sk .b .v.good{ color:var(--good); } .sinfo .sk .b .v.crit{ color:var(--crit); }
  .sinfo .sk .b .k{ font-size:9.5px; color:var(--mut); margin-top:2px; }
  .block{ background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:11px 12px; }
  .block .st{ font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--mut); font-weight:700; margin-bottom:9px; }

  .main{ flex:1; min-width:0; overflow:auto; padding:16px; }
  .mhead{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .mhead .lg{ width:40px; height:40px; image-rendering:pixelated; }
  .mhead .ti{ font-size:17px; font-weight:800; letter-spacing:-.2px; color:var(--txt); }
  .mhead .st{ font-size:12px; color:var(--mut); margin-top:1px; }
  .mhead .sp{ flex:1; }

  .scene{ position:relative; overflow:hidden; border-radius:11px; border:1px solid var(--line2); background:#0d1119; }
  .scene.sm{ height:194px; } .scene.lg{ height:100%; min-height:280px; }
  .scene .bg{ position:absolute; inset:0; }
  .scene .ground{ position:absolute; left:0; right:0; bottom:0; }
  .scene .hud{ position:absolute; top:10px; left:12px; z-index:6; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.75); }
  .scene .hud .n{ font-weight:800; font-size:13px; } .scene .hud .h{ font-size:10.5px; opacity:.9; }
  .scene .live{ position:absolute; top:10px; right:12px; z-index:6; font-size:10px; color:#fff; background:#c0392b; padding:3px 8px; border-radius:20px; display:flex; align-items:center; gap:5px; }
  .scene .live::before{ content:""; width:6px; height:6px; border-radius:50%; background:#fff; animation:blink 1.4s infinite; }
  @keyframes blink{ 50%{ opacity:.25; } }
  .scene .empty{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--mut); font-size:12px; }
  .actor{ position:absolute; bottom:15%; z-index:4; }
  .actor img{ display:block; image-rendering:pixelated; filter:drop-shadow(0 5px 6px rgba(0,0,0,.5)); }
  .actor .sh{ position:absolute; left:50%; bottom:-5px; width:72%; height:9px; transform:translateX(-50%); background:radial-gradient(closest-side, rgba(0,0,0,.55), transparent); z-index:-1; }

  .sect{ font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--mut); font-weight:700; margin:0 0 9px; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:14px; }
  .dgrid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:13px; margin-bottom:13px; }
  .dgrid .span2{ grid-column:span 2; }
  .leadline{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:11px; font-size:12px; }
  .leadline img{ width:26px; height:26px; image-rendering:pixelated; }

  .kpis{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:14px; }
  .kpi{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 13px; }
  .kpi .v{ font-size:21px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.4px; line-height:1.1; }
  .kpi .v.good{ color:var(--good); } .kpi .v.crit{ color:var(--crit); } .kpi .k{ font-size:10.5px; color:var(--mut); margin-top:3px; }

  .rar{ display:inline-block; font-size:10px; font-weight:700; padding:1px 6px; border-radius:5px; }
  .boosts{ display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
  .bch{ display:flex; align-items:center; gap:5px; font-size:11px; padding:4px 8px; border-radius:7px; background:var(--panel2); border:1px solid var(--line2); }
  .bch .t{ color:var(--warn); font-weight:700; font-variant-numeric:tabular-nums; }

  .goal{ margin-bottom:11px; } .goal:last-child{ margin:0; }
  .goal .gl{ display:flex; font-size:12px; margin-bottom:5px; } .goal .gl .gv{ margin-left:auto; color:var(--mut); font-variant-numeric:tabular-nums; } .goal .gl .gv.ok{ color:var(--good); }
  .trk{ height:7px; border-radius:5px; background:#0b0f17; border:1px solid var(--line); overflow:hidden; }
  .trk i{ display:block; height:100%; background:var(--info); border-radius:5px; }
  .trk i.gold{ background:var(--gold); } .trk i.card{ background:#b184ff; }

  .mrow{ display:flex; justify-content:space-between; font-size:12px; padding:5px 0; border-bottom:1px solid var(--line); }
  .mrow:last-child{ border:0; } .mrow .k{ color:var(--mut); } .mrow .v{ font-weight:700; font-variant-numeric:tabular-nums; }
  .mrow .v.gold{ color:var(--gold); } .mrow .v.crit{ color:var(--crit); } .mrow .v.good{ color:var(--good); }
  .tyb{ display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; padding:2px 6px; border-radius:6px; border:1px solid; margin:0 3px 3px 0; font-variant-numeric:tabular-nums; }
  .mu-h{ font-size:11.5px; font-weight:700; color:var(--txt); margin-bottom:5px; }
  .mu-row{ display:flex; gap:8px; align-items:baseline; padding:3px 0; }
  .mu-row .mu-k{ color:var(--mut); font-size:11px; min-width:62px; flex-shrink:0; }
  .mu-row .mu-v{ display:flex; flex-wrap:wrap; }

  .prh{ display:flex; align-items:center; gap:11px; margin-bottom:11px; }
  .prh .pic{ width:40px; height:40px; border-radius:10px; display:grid; place-items:center; font-size:20px; background:#221c0c; border:1px solid #4a3d14; }
  .prh .pn{ font-weight:800; font-size:13.5px; } .prh .px{ font-size:11px; color:var(--mut); margin-top:1px; }
  .prh .pb{ margin-left:auto; text-align:right; } .prh .pb .v{ font-size:19px; font-weight:800; color:var(--good); } .prh .pb .k{ font-size:9px; color:var(--mut); text-transform:uppercase; letter-spacing:.05em; }
  .ranks{ display:flex; gap:5px; margin:0 0 10px; }
  .rp{ flex:1; text-align:center; padding:6px 2px 5px; border-radius:8px; background:var(--panel2); border:1px solid var(--line); }
  .rp .l{ font-weight:800; font-size:12.5px; } .rp .p{ font-size:9px; color:var(--mut); margin-top:1px; }
  .rp.cur{ background:#241d0b; border-color:var(--gold); } .rp.cur .l{ color:var(--gold); } .rp.cur .p{ color:#e3c877; }
  .prof-note{ font-size:11px; color:var(--warn); background:rgba(255,177,81,.07); border:1px dashed rgba(255,177,81,.32); border-radius:9px; padding:8px 11px; margin-top:2px; }

  .capbar{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:10px; }
  .capbar select, .capbar label{ font-size:12px; }
  .capbar select{ background:var(--panel2); color:var(--txt); border:1px solid var(--line2); border-radius:7px; padding:5px 8px; }
  .capbar label{ display:flex; align-items:center; gap:5px; color:var(--mut); }
  .capbar .cnt{ margin-left:auto; font-size:11.5px; color:var(--mut); font-variant-numeric:tabular-nums; }
  .tblwrap{ overflow:auto; max-height:440px; border:1px solid var(--line); border-radius:11px; }
  table.caps{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.caps th{ text-align:left; font-weight:600; color:var(--mut); padding:9px 12px; background:var(--panel3); border-bottom:1px solid var(--line); position:sticky; top:0; cursor:pointer; white-space:nowrap; }
  table.caps th:hover{ color:var(--txt); }
  table.caps td{ padding:8px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.caps tr:last-child td{ border:0; }
  table.caps tbody tr:hover{ background:var(--hover); }
  table.caps tr.sh{ background:rgba(255,206,86,.05); }
  table.caps img{ width:26px; height:26px; image-rendering:pixelated; vertical-align:middle; margin-right:7px; }
  .num{ font-variant-numeric:tabular-nums; text-align:right; }

  .ovgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; }
  .ovc{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:15px; cursor:pointer; }
  .ovc:hover{ border-color:var(--line2); background:var(--panel2); }
  .ovc .h{ display:flex; align-items:center; gap:11px; margin-bottom:12px; }
  .ovc .h img{ width:46px; height:46px; image-rendering:pixelated; }
  .ovc .h .n{ font-weight:800; font-size:14px; display:flex; align-items:center; gap:7px; color:var(--txt); } .ovc .h .u{ font-size:11px; color:var(--mut); margin-top:2px; }
  .ovc .kp{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; margin-bottom:11px; }
  .ovc .kp .v{ font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; } .ovc .kp .v.good{ color:var(--good); } .ovc .kp .v.crit{ color:var(--crit); } .ovc .kp .k{ font-size:9.5px; color:var(--mut); }
  .ovc .open{ font-size:11px; color:var(--gold); }

  .gamearea{ flex:1; min-width:0; padding:16px; display:flex; flex-direction:column; }
  .empty-main{ color:var(--mut); font-size:13px; padding:30px; text-align:center; }

  #toast{ position:fixed; top:54px; right:14px; display:flex; flex-direction:column; gap:8px; z-index:40; }
  .t{ background:var(--panel2); border:1px solid var(--line2); border-left:4px solid var(--gold); padding:9px 13px; border-radius:9px; font-size:12.5px; box-shadow:0 8px 22px #000a; }

<script>
  const P = window.poke || null;
  const spr  = (d)=> d ? `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${d}.png` : '';
  const anim = (d)=> d ? `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/${d}.gif` : '';
  const RARS=['Fraca','Comum','Incomum','Rara','Épica','Lendária','Mythic','Ancient','Divine'];
  const rcol=(r)=>getComputedStyle(document.documentElement).getPropertyValue('--r-'+r).trim()||'#8791a4';
  const fmt=(n)=> (n==null?'—':Number(n).toLocaleString('pt-BR'));
  const fmtSigned=(n)=> n==null?'—':(n>=0?'+':'−')+fmt(Math.abs(n));
  const timeStr=(ts)=>{ try{ return new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }catch{ return ''; } };
  function since(ms){ if(!ms) return ''; const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h?`${h}h${String(m).padStart(2,'0')}`:`${m}min`; }
  function untilStr(u){ if(!u) return ''; const ms=u-Date.now(); if(ms<=0) return 'expirou'; const m=Math.round(ms/60000); return m>=60?`${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`:`${m}min`; }
  const onerr = `onerror="this.onerror=null;this.src='';this.style.visibility='hidden'"`;

  // ---- card do hover: aparece só em captura "notável" (Lendária+, Épica com IV 180+, ou shiny).
  // Critério espelha game-parse.js (catchScore/isNotableCatch) — manter os dois em sincronia.
  const NEAR_PERFECT_IV = 180;
  const _ivOf = (x)=> +(x.iv!=null?x.iv:x.ivTotal)||0;
  function catchScore(x){ if(!x) return -Infinity; return (x.shiny?100:0)+(+x.quality||0)+Math.max(0,_ivOf(x)-150)/42*0.20; }
  function isNotable(x){ if(!x) return false; const q=+x.quality||0; return !!x.shiny||q>=1.7||(q>=1.5&&_ivOf(x)>=NEAR_PERFECT_IV); }
  const TYPE_PT={NORMAL:'Normal',FIRE:'Fogo',WATER:'Água',GRASS:'Planta',ELECTRIC:'Elétrico',ICE:'Gelo',FIGHTING:'Lutador',POISON:'Venenoso',GROUND:'Terra',FLYING:'Voador',PSYCHIC:'Psíquico',BUG:'Inseto',ROCK:'Pedra',GHOST:'Fantasma',DRAGON:'Dragão',DARK:'Sombrio',STEEL:'Aço',FAIRY:'Fada'};
  // efetividade de tipo (18 tipos, PokeAPI; ausente = 1×) — espelha MAP_TC do main.js
  const EFF_TC={
    NORMAL:{ROCK:.5,STEEL:.5,GHOST:0},
    FIRE:{BUG:2,STEEL:2,GRASS:2,ICE:2,ROCK:.5,FIRE:.5,WATER:.5,DRAGON:.5},
    WATER:{GROUND:2,ROCK:2,FIRE:2,WATER:.5,GRASS:.5,DRAGON:.5},
    GRASS:{GROUND:2,ROCK:2,WATER:2,FLYING:.5,POISON:.5,BUG:.5,STEEL:.5,FIRE:.5,GRASS:.5,DRAGON:.5},
    ELECTRIC:{FLYING:2,WATER:2,GRASS:.5,ELECTRIC:.5,DRAGON:.5,GROUND:0},
    ICE:{FLYING:2,GROUND:2,GRASS:2,DRAGON:2,STEEL:.5,FIRE:.5,WATER:.5,ICE:.5},
    FIGHTING:{NORMAL:2,ROCK:2,STEEL:2,ICE:2,DARK:2,FLYING:.5,POISON:.5,BUG:.5,PSYCHIC:.5,FAIRY:.5,GHOST:0},
    POISON:{GRASS:2,FAIRY:2,POISON:.5,GROUND:.5,ROCK:.5,GHOST:.5,STEEL:0},
    GROUND:{POISON:2,ROCK:2,STEEL:2,FIRE:2,ELECTRIC:2,BUG:.5,GRASS:.5,FLYING:0},
    FLYING:{FIGHTING:2,BUG:2,GRASS:2,ROCK:.5,STEEL:.5,ELECTRIC:.5},
    PSYCHIC:{FIGHTING:2,POISON:2,STEEL:.5,PSYCHIC:.5,DARK:0},
    BUG:{GRASS:2,PSYCHIC:2,DARK:2,FIGHTING:.5,FLYING:.5,POISON:.5,GHOST:.5,STEEL:.5,FIRE:.5,FAIRY:.5},
    ROCK:{FLYING:2,BUG:2,FIRE:2,ICE:2,FIGHTING:.5,GROUND:.5,STEEL:.5},
    GHOST:{GHOST:2,PSYCHIC:2,DARK:.5,NORMAL:0},
    DRAGON:{DRAGON:2,STEEL:.5,FAIRY:0},
    DARK:{GHOST:2,PSYCHIC:2,FIGHTING:.5,DARK:.5,FAIRY:.5},
    STEEL:{ROCK:2,ICE:2,FAIRY:2,STEEL:.5,FIRE:.5,WATER:.5,ELECTRIC:.5},
    FAIRY:{FIGHTING:2,DRAGON:2,DARK:2,POISON:.5,STEEL:.5,FIRE:.5},
  };
  const upT=(t)=> t?String(t).toUpperCase():null;
  function eff1(a,d){ const r=EFF_TC[a]; if(!r) return 1; const v=r[d]; return v==null?1:v; }
  function effVs(a,d1,d2){ return eff1(a,d1)*(d2?eff1(a,d2):1); }               // dupla tipagem multiplica
  function effCol(m){ return m>=4?'#f7cf4f':m>=2?'#56df89':m<1?'#ff6b7a':'var(--txt)'; }
  const _stLabel={hp:'HP',atk:'Atk',def:'Def',spAtk:'SpA',spDef:'SpD',speed:'Spe'};
  function pokeCardHTML(p){
    const col=p.shiny?'var(--gold)':rcol(p.rarity);
    const types=[p.type1,p.type2].filter(Boolean).map(t=>`<span class="pc-ty">${TYPE_PT[t]||t}</span>`).join('');
    const kv=(k,v)=>`<div class="pc-kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;
    const rows=[ p.level!=null?kv('Nível',fmt(p.level)):'', p.iv!=null?kv('IV',p.iv+'/192'):'',
      p.quality!=null?kv('Quality',(+p.quality).toFixed(3)):'', p.power!=null?kv('Power',fmt(p.power)):'' ].join('');
    const stats=p.stats?`<div class="pc-stats">${['hp','atk','def','spAtk','spDef','speed'].map(k=>p.stats[k]!=null?`<div class="pc-st"><span class="k">${_stLabel[k]}</span><span class="v">${fmt(p.stats[k])}</span></div>`:'').join('')}</div>`:'';
    // Potencial do exemplar (estilo justpokedex): % do IV sobre o máximo (192). Exato — vem do ivTotal

  // ----- acesso rápido à hunt: últimas hunts + sugestão de leveling -----
  function pushRecentHunt(c){ if(!c||c.slot==null) return;
    if(!c.hunt||!c.hunt.name){ lastHuntKey[c.slot]=null; return; }             // sem hunt: solta o dedupe
    const key=c.hunt.slug||c.hunt.name;
    if(lastHuntKey[c.slot]===key) return;                                       // mesma hunt → nada muda
    lastHuntKey[c.slot]=key;
    const list=(recentHunts[c.slot]||[]).filter(x=>x.n!==c.hunt.name);          // sobe pro topo sem duplicar
    list.unshift({n:c.hunt.name, d:c.hunt.dex||null});
    recentHunts[c.slot]=list.slice(0,7);
    try{ localStorage.setItem('recentHunts',JSON.stringify(recentHunts)); }catch{} }
  // Sugestão de leveling. As hunts do jogo vêm em FAIXAS discretas (…,80,100,150) e o teto
  // farmável é 150 — acima disso só há lendários Lv200 (fora de hunt normal). Então: pega as
  // criaturas em que o líder tem vantagem, da faixa do nível dele até +20 (com clamp em 150),
  // e ordena por EFICIÊNCIA ≈ XP/h estimado. Como o XP/kill é constante dentro da faixa, o que
  // desempata é a velocidade de kill: XP/h ∝ xpKill × efetividade ÷ bulk do alvo (HP·Def médio).
  // A efetividade usa os TIPOS DOS GOLPES do líder (cobertura), não só o tipo da espécie.
  const FARM_CAP=150;   // maior faixa de hunt farmável (Lv200 = lendários, ignorados)
  function leaderAtkTypes(c){ const lead=(c.team||[]).find(p=>p.leader)||null;
    // tipos de golpe da espécie do líder (via catálogo) → cobertura real; senão cai pro tipo dele
    const sp=(creaturesCache||[]).find(x=>x.dex===(c.leader&&c.leader.dex));
    const mv=sp&&sp.moveTypes&&sp.moveTypes.length?sp.moveTypes.map(upT):[];
    if(mv.length) return mv;
    return [lead&&upT(lead.type1), lead&&upT(lead.type2)].filter(Boolean); }
  function levelSuggest(c){ const cr=creaturesCache; if(!cr||!cr.length) return [];
    const lead=(c.team||[]).find(p=>p.leader)||null;
    const lv=(c.leader&&c.leader.level)||(lead&&lead.level)||0;
    if(!lead||!lv) return [];
    const atk=leaderAtkTypes(c); if(!atk.length) return [];
    const hi=Math.min(lv+20, FARM_CAP);              // nunca acima do teto de 150
    const lo=lv>FARM_CAP ? FARM_CAP : lv;            // já passou de 150 → libera o pool inteiro de 150
    const out=[];
    for(const x of cr){ const hl=x.huntLevel||0;
      if(hl>FARM_CAP) continue;                                                 // sem lendários (200)
      if(hl<lo || hl>hi) continue;                                              // faixa: do nível até +20 (clamp 150)
      const d1=upT(x.type1), d2=upT(x.type2);
      const e=Math.max(...atk.map(a=>effVs(a,d1,d2)));                          // melhor golpe do líder vs o alvo
      if(e<2) continue;                                                         // só vantagem clara (×2/×4)
      const bulk=(x.baseHp||0)*(((x.baseDef||0)+(x.baseSpDef||0))/2);           // resistência ~ velocidade de kill
      const effHP=bulk>0?bulk:(hl||1)*1000;                                     // fallback se faltar stat
      const pen=(hl-lv)<=10?1:0.7;                                              // >10 níveis acima: mais lento
      out.push({n:x.name, d:x.dex, hl, e, score:(x.xpKill||1)*e/effHP*pen}); }
    out.sort((a,b)=>b.score-a.score);
    return out.slice(0,7); }

  // ---------- Box Pokémon ----------
  // coleção persistida (P.getBox) filtrada por quality>=qMin E IV>=ivMin; hover sempre ligado + PIW por poke.
  // agrupa por CONTA e separa Equipe (SEMPRE mostra, mesmo fora do filtro) da Coleção (passa quality E IV)
  function _boxByAccount(){ const src=boxData||{}, groups=[];
    const keys=Object.keys(src).sort((a,b)=>(+String(a).replace('acc',''))-(+String(b).replace('acc','')));
    for(const acc of keys){ if(boxAcc && acc!==boxAcc) continue; const m=src[acc]||{}, team=[], coll=[];
      for(const id of Object.keys(m)){ const p=m[id]; if(!p) continue;
        if(p.team||p.leader) team.push(p);                                              // equipe: sempre
        else if((+p.quality||0)>=boxCfg.qMin && _ivOf(p)>=boxCfg.ivMin) coll.push(p); } // coleção: só notável
      team.sort((a,b)=>((b.leader?1:0)-(a.leader?1:0))||((b.level||0)-(a.level||0)));
      coll.sort((a,b)=>((+b.quality||0)-(+a.quality||0))||(_ivOf(b)-_ivOf(a)));
      if(team.length||coll.length) groups.push({acc, name:boxAccName(acc), team, coll}); }
    return groups; }
  function boxCount(){ if(!boxData) return 0; let n=0; for(const g of _boxByAccount()) n+=g.team.length+g.coll.length; return n; }
  function boxAccName(acc){ const s=+String(acc).replace('acc',''); return (cs(s)&&cs(s).name)||('Conta '+s); }
  function boxCardHTML(p){ const iv=_ivOf(p), pot=iv?Math.round(iv/192*100):0; const col=p.shiny?'var(--gold)':rcol(p.rarity);
    const d={name:p.name,dex:p.dex,level:p.level,iv:p.iv,quality:p.quality,rarity:p.rarity,power:p.power,type1:p.type1,type2:p.type2,stats:p.stats,shiny:!!p.shiny};
    const tag=p.leader?'<span class="box-tag lead">Líder</span>':(p.team?'<span class="box-tag team">Equipe</span>':'');
    const types=[p.type1,p.type2].filter(Boolean).map(t=>`<span class="box-ty">${TYPE_PT[t]||t}</span>`).join('');
    return `<div class="box-card has-card" data-card="${encodeURIComponent(JSON.stringify(d))}">
      <div class="box-top"><img src="${spr(p.dex)}" ${onerr}>${tag}</div>
      <div class="box-nm">${esc(p.name)||'?'}${p.shiny?' ✨':''}</div>
      <div class="box-rar" style="color:${col}">${p.rarity||'—'} · Q ${p.quality!=null?(+p.quality).toFixed(2):'—'}</div>
      <div class="box-types">${types||'<span style="color:var(--mut2);font-size:10px">—</span>'}</div>
      <div class="box-iv"><span>IV ${iv}/192</span><span class="pot">${pot}%</span></div>
      <div class="box-bar"><i style="width:${pot}%"></i></div>
      <div class="box-foot"><span class="box-lv">Nv ${p.level!=null?fmt(p.level):'?'}</span>${p.stats?`<button class="box-piw" data-piw="${encodeURIComponent(JSON.stringify({name:p.name,level:p.level,stats:p.stats}))}" title="Abrir no PIW Tools com os stats deste pokémon">🧮 PIW</button>`:''}</div>
    </div>`; }
  function renderBox(){ const groups=_boxByAccount(), total=groups.reduce((n,g)=>n+g.team.length+g.coll.length,0);
    const qtxt=`quality ≥ ${String(boxCfg.qMin).replace('.',',')} e IV ≥ ${boxCfg.ivMin}/192`;
    const chips=`<button class="acc-chip ${!boxAcc?'on':''}" data-bacc="">Todas</button>`+accounts.map(s=>`<button class="acc-chip ${boxAcc===('acc'+s)?'on':''}" data-bacc="acc${s}">${cs(s).name||('Conta '+s)}</button>`).join('');
    const grid=(arr)=>`<div class="box-grid">${arr.map(p=>boxCardHTML(p)).join('')}</div>`;
    const secs=groups.map(g=>{
      const team=g.team.length?`<div class="box-subh team">🎯 Equipe <span>${g.team.length}</span></div>${grid(g.team)}`:'';

    const body=total?secs:`<div class="empty-main">Nenhum pokémon na equipe nem com <b>${qtxt}</b>.<br>Ajuste o filtro nas ⚙, ou abra a coleção dentro do jogo pra sincronizar a Box.</div>`;
    return `<div class="mhead"><div><div class="ti">📦 Box Pokémon</div><div class="st">${total} pokémon · equipe sempre visível · coleção: ${qtxt} · limiar nas ⚙</div></div><div class="sp"></div></div>

  function renderMarket(){
    const fromNm=marketData&&marketData.fromSlot!=null?(cs(marketData.fromSlot).name||('Conta '+marketData.fromSlot)):null;
    const sortBtn=(k,lb)=>`<button class="acc-chip ${marketSort===k?'on':''}" data-msort="${k}">${lb}</button>`;

      <span style="color:var(--mut2);font-size:11px">ordenar:</span>${sortBtn('quality','Quality')}${sortBtn('iv','IV')}${sortBtn('price','Preço')}
      ${fromNm?`<span style="margin-left:auto;color:var(--mut2);font-size:10.5px">via ${esc(fromNm)}</span>`:''}</div>`;

    for(const n of seq){ const o=actx.createOscillator(),g=actx.createGain(); o.type='sine'; o.frequency.value=n.f; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.0001,t0+n.t); g.gain.exponentialRampToValueAtTime(.28,t0+n.t+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+n.t+n.d); o.start(t0+n.t); o.stop(t0+n.t+n.d+.03); } }catch{} }
  const SND={ shiny_capture:[{f:523,t:0,d:.12},{f:659,t:.1,d:.12},{f:784,t:.2,d:.14},{f:1047,t:.32,d:.25}], shiny_wild:[{f:659,t:0,d:.1},{f:988,t:.12,d:.2}], rare_capture:[{f:440,t:0,d:.1},{f:587,t:.13,d:.16}],
    shiny_field:[{f:784,t:0,d:.13},{f:988,t:.14,d:.13},{f:1319,t:.28,d:.16},{f:988,t:.46,d:.13},{f:1319,t:.6,d:.3}],   // fanfarra pra shiny na tela (bem distinta)

    warn:[{f:392,t:0,d:.13},{f:294,t:.15,d:.18}], crit:[{f:330,t:0,d:.14},{f:247,t:.17,d:.14},{f:196,t:.34,d:.24}], ok:[{f:523,t:0,d:.1},{f:784,t:.1,d:.16}] };
  function alertInfo(ev){ const acc=ev.accountName||'';
    switch(ev.type){
      case 'shiny_capture': return {msg:`✨ SHINY seu! ${acc} — ${ev.name}`, cls:'', snd:SND.shiny_capture};
      case 'shiny_field': return {msg:`✨✨ SHINY NA TELA! <b>${acc}</b>${ev.name?' — '+ev.name:''} · captura ele!`, cls:'', snd:SND.shiny_field};
      case 'shiny_wild': return {msg:`✨ Shiny selvagem: ${ev.name} (${acc})`, cls:'', snd:SND.shiny_wild};
      case 'balls_low': return {msg:`🔴 <b>${acc}</b>: Ultra Balls acabando (${fmt(ev.count)})`, cls:'warn', snd:SND.warn};
      case 'potions_low': return {msg:`💊 <b>${acc}</b>: potions acabando (${fmt(ev.count)})`, cls:'warn', snd:SND.warn};
      case 'revives_low': return {msg:`💉 <b>${acc}</b>: revives acabando (${fmt(ev.count)})`, cls:'warn', snd:SND.warn};
      case 'potions_out': return {msg:`💊 <b>${acc}</b>: SEM POTIONS — o time pode desmaiar!`, cls:'crit', snd:SND.crit};
      case 'died': return {msg:`💀 <b>${acc}</b>: ${ev.name||'seu pokémon'} desmaiou!`, cls:'crit', snd:SND.crit};
      case 'sell_blocked': return {msg:`🛑 <b>${acc}</b>: bloqueei a venda de <b>${ev.what||'item protegido'}</b>. Desative a proteção nas ⚙ se quiser vender.`, cls:'crit', snd:SND.crit};
      case 'disconnected': return {msg:`🔌 <b>${acc}</b>: desconectou${ev.reason==='session-replaced'?' (logou em outro lugar)':''}`, cls:'crit', snd:SND.crit};
      case 'reconnected': return {msg:`✅ <b>${acc}</b>: reconectou`, cls:'ok', snd:SND.ok};
      case 'gift': return {msg:`🎁 <b>${acc}</b>: ${ev.count>1?ev.count+' presentes':'presente'} pra coletar no correio`, cls:'ok', snd:SND.ok};
      default: return {msg:`Raro: ${acc} — ${ev.name} ${ev.rarity||''} ${ev.iv?('IV '+ev.iv):''}`, cls:'rare', snd:SND.rare_capture};
    } }
